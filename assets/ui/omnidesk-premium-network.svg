<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="315" viewBox="0 0 1080 315" role="img" aria-labelledby="title desc">
<title id="title">OmniDesk decorative global network</title>
<desc id="desc">Abstract red illuminated globe, connectivity arcs and remote desktop silhouettes; decorative product art, not live connectivity status.</desc>
