  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa1641"/><stop offset="1" stop-color="#803351"/></linearGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".8" fill="#f62958" opacity=".58"/></pattern>
