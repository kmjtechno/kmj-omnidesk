name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Measure synthetic capture-to-render reference path
        run: |
          mkdir -p artifacts
          cargo run -p omnidesk-core --example pipeline_benchmark --release > artifacts/pipeline-benchmark.json
          cat artifacts/pipeline-benchmark.json
      - name: Measure direct-connect reference path
        run: |
          cargo run -p omnidesk-core --example connectivity_benchmark --release > artifacts/connectivity-benchmark.json
          cat artifacts/connectivity-benchmark.json
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: artifacts/*.json
          if-no-files-found: error


  windows-capture:
    name: Windows capture gate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile Windows capture path
        run: cargo check -p omnidesk-core --all-targets
      - name: Test Windows capture conversion
        run: cargo test -p omnidesk-core --lib
      - name: Capture Windows desktop smoke frame
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          cargo run -p omnidesk-core --example windows_capture_smoke --release | Tee-Object -FilePath artifacts/windows-capture-smoke.json
      - name: Upload Windows capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-evidence
          path: artifacts/windows-capture-smoke.json
          if-no-files-found: error
