name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: M8 collaboration security and resume gate
        run: cargo test -p omnidesk-core collaboration::tests --lib
      - name: M9 licensing crypto and policy gate
        run: cargo test -p omnidesk-core licensing::tests --lib
      - name: M9 committed licensing vector conformance gate
        run: cargo test -p omnidesk-core --test licensing_vectors
      - name: Verify M8 runtime evidence
        run: |
          mkdir -p artifacts
          cargo run -p omnidesk-core --example m8_runtime_evidence --release > artifacts/m8-runtime-evidence.json
          cat artifacts/m8-runtime-evidence.json
          grep -q '"m8_runtime_evidence":"PASS"' artifacts/m8-runtime-evidence.json
      - name: Verify M8 weak-network transfer resume
        run: |
          cargo run -p omnidesk-core --example m8_weak_network_resume --release > artifacts/m8-weak-network-resume.json
          cat artifacts/m8-weak-network-resume.json
          grep -q '"m8_weak_network_resume":"PASS"' artifacts/m8-weak-network-resume.json
          grep -q '"evidence_type":"deterministic_synthetic_impairment"' artifacts/m8-weak-network-resume.json

      - name: M4 REALNET-60 schema conformance gate
        run: python3 scripts/check_m4_schemas.py

      - name: M4 REALNET-60 evidence collector tests
        run: python3 scripts/test_m4_evidence.py

      - name: M4 REALNET-60 semantic validator gate
        run: cargo test -p omnidesk-m4-validator --all-targets

      - name: Measure synthetic capture-to-render reference path
        run: |
          mkdir -p artifacts
          cargo run -p omnidesk-core --example pipeline_benchmark --release > artifacts/pipeline-benchmark.json
          cat artifacts/pipeline-benchmark.json
      - name: Measure direct-connect reference path
        run: |
          cargo run -p omnidesk-core --example connectivity_benchmark --release > artifacts/connectivity-benchmark.json
          cat artifacts/connectivity-benchmark.json
      - name: Verify local NAT mapping and reconnect matrix
        run: |
          cargo run -p omnidesk-core --example nat_reconnect_matrix --release > artifacts/nat-reconnect-matrix.json
          cat artifacts/nat-reconnect-matrix.json
      - name: Verify M7 terminal-free native primary flow
        run: |
          cargo run -p omnidesk-desktop --example m7_primary_flow_evidence --release > artifacts/m7-primary-flow.json
          cat artifacts/m7-primary-flow.json
          grep -q '"m7_primary_flow":"PASS"' artifacts/m7-primary-flow.json
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: artifacts/*.json
          if-no-files-found: error


  windows-capture:
    name: Windows capture gate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile Windows capture path
        run: cargo check -p omnidesk-core --all-targets
      - name: Test Windows capture conversion
        run: cargo test -p omnidesk-core --lib
      - name: Compile Windows desktop host
        run: cargo build -p omnidesk-desktop --release
      - name: Measure Windows desktop resource baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $process = Start-Process -FilePath "target\release\omnidesk-desktop.exe" -PassThru
          Start-Sleep -Seconds 2
          $process.Refresh()
          $cpuStart = $process.TotalProcessorTime.TotalSeconds
          $cpuWindowSeconds = 2
          Start-Sleep -Seconds $cpuWindowSeconds
          $process.Refresh()
          $cpuEnd = $process.TotalProcessorTime.TotalSeconds
          $logicalProcessors = [Environment]::ProcessorCount
          $cpuPercent = (($cpuEnd - $cpuStart) / ($cpuWindowSeconds * $logicalProcessors)) * 100
          $sample = [ordered]@{
            process = "omnidesk-desktop"
            working_set_mib = [math]::Round($process.WorkingSet64 / 1MB, 2)
            private_memory_mib = [math]::Round($process.PrivateMemorySize64 / 1MB, 2)
            idle_cpu_percent = [math]::Round($cpuPercent, 3)
            idle_cpu_milli_percent = [math]::Round($cpuPercent * 1000)
            logical_processors = $logicalProcessors
            warmup_seconds = 2
            cpu_sample_seconds = $cpuWindowSeconds
          }
          $sample | ConvertTo-Json | Tee-Object -FilePath artifacts/windows-desktop-resource.json
          $memoryBudgetMiB = 64
          $cpuBudgetMilliPercent = 500
          if ($sample.working_set_mib -gt $memoryBudgetMiB) {
            Stop-Process -Id $process.Id -Force
            throw "Windows desktop working set $($sample.working_set_mib) MiB exceeds $memoryBudgetMiB MiB budget"
          }
          if ($sample.idle_cpu_milli_percent -gt $cpuBudgetMilliPercent) {
            Stop-Process -Id $process.Id -Force
            throw "Windows desktop idle CPU $($sample.idle_cpu_milli_percent) milli-percent exceeds $cpuBudgetMilliPercent budget"
          }
          Stop-Process -Id $process.Id -Force
      - name: Capture Windows desktop smoke frame
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          cargo run -p omnidesk-core --example windows_capture_smoke --release | Tee-Object -FilePath artifacts/windows-capture-smoke.json
      - name: Upload Windows capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-evidence
          path: |
            artifacts/windows-capture-smoke.json
            artifacts/windows-desktop-resource.json
          if-no-files-found: error
