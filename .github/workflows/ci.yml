name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Measure synthetic capture-to-render reference path
        run: |
          mkdir -p artifacts
          cargo run -p omnidesk-core --example pipeline_benchmark --release > artifacts/pipeline-benchmark.json
          cat artifacts/pipeline-benchmark.json
      - name: Upload pipeline benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-benchmark
          path: artifacts/pipeline-benchmark.json
          if-no-files-found: error
