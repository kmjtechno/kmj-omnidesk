<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#070809"/>
<text x="80" y="110" font-family="Arial" font-size="68" font-weight="800" fill="#fff">Built for <tspan fill="#ff263d">real remote work</tspan></text>
<text x="80" y="160" font-family="Arial" font-size="27" fill="#aeb5c0">A lightweight remote-access stack with measurable gates instead of marketing-only claims.</text>
<g font-family="Arial">
  <g transform="translate(80 220)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#ff263d"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">Direct-first connectivity</text><text x="28" y="96" font-size="20" fill="#b7bec8">Encrypted P2P is preferred.</text><text x="28" y="130" font-size="20" fill="#b7bec8">Relay is fallback, not the default.</text><path d="M30 185 H420" stroke="#1ee37a" stroke-width="6"/><circle cx="70" cy="185" r="12" fill="#1ee37a"/><circle cx="380" cy="185" r="12" fill="#1ee37a"/></g>
  <g transform="translate(575 220)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#ff263d"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">Resumable transfer</text><text x="28" y="96" font-size="20" fill="#b7bec8">Chunk integrity + resume checkpoints.</text><rect x="28" y="155" width="390" height="18" rx="9" fill="#252a31"/><rect x="28" y="155" width="285" height="18" rx="9" fill="#ff263d"/><text x="28" y="205" font-size="17" fill="#8c95a2">Weak-network resume evidence in CI</text></g>
  <g transform="translate(1070 220)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#ff263d"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">Secure client boundary</text><text x="28" y="96" font-size="20" fill="#b7bec8">Signed entitlements.</text><text x="28" y="130" font-size="20" fill="#b7bec8">Replay / rollback / key-window checks.</text><rect x="28" y="160" width="118" height="42" rx="10" fill="#321019"/><text x="50" y="188" font-size="17" fill="#fff">FAIL CLOSED</text></g>
  <g transform="translate(80 495)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#57212a"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">Native desktop UX</text><text x="28" y="96" font-size="20" fill="#b7bec8">Keyboard, mouse and accessibility.</text><text x="28" y="130" font-size="20" fill="#b7bec8">Black/red KMJ visual system.</text><text x="28" y="185" font-size="18" fill="#ff5a6b">Resource budget enforced in CI</text></g>
  <g transform="translate(575 495)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#57212a"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">Collaboration</text><text x="28" y="96" font-size="20" fill="#b7bec8">Clipboard sync • File transfer</text><text x="28" y="130" font-size="20" fill="#b7bec8">Audio • Multi-monitor</text><text x="28" y="164" font-size="20" fill="#b7bec8">Reboot/reconnect state</text></g>
  <g transform="translate(1070 495)"><rect width="450" height="230" rx="24" fill="#101318" stroke="#57212a"/><text x="28" y="54" font-size="28" font-weight="700" fill="#fff">AI-ready engineering</text><text x="28" y="96" font-size="20" fill="#b7bec8">Humans + AI agents can contribute.</text><text x="28" y="130" font-size="20" fill="#b7bec8">Same tests. Same evidence. Same gates.</text><text x="28" y="185" font-size="18" fill="#ff5a6b">No special pass for generated code.</text></g>
</g>
<text x="80" y="820" font-family="Arial" font-size="20" fill="#858d99">Verified status is tracked in ROADMAP.yaml and CI.</text>
</svg>