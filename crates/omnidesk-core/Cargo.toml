[package]
name = "omnidesk-core"
version = "0.0.1"
# Proprietary: these crates are never published to a public registry.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
omnidesk-protocol = { path = "../omnidesk-protocol" }
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
win-screenshot = "4.0.14"

[lints]
workspace = true
